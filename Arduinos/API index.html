<!doctype html>
<html>

<head>
    <title>Graphics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <h1>Graphics</h1>
    <div style="display: flex;">
        <div style="width: 50%;">
            <canvas id="sensorTemperatura" style="position: relative; height: 40vh; width: 40vw;"></canvas>
        </div>
        <div style="width: 50%;">
            <canvas id="sensorUmidade"></canvas>
        </div>
    </div>

    <script>
        var sensorTemperatura = new Chart(document.getElementById('sensorTemperatura').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Temperatura',
                    borderColor: 'orange',
                    backgroundColor: 'orange'
                }, {
                    label: 'Temperatura Maxima',
                    borderColor: 'red',
                    backgroundColor: 'red'
                },
                {label: 'Temperatura Minima',
                    borderColor: 'green',
                    backgroundColor: 'green'}
            ]
            },
            options: {
                scales: {
                    x: {
                        beginAtZero: true
                    },
                    y: {
                        title: {
                            display: true,
                            text: '(°C)'
                        },
                        beginAtZero: true,
                    },
                },
            }
        });

        var sensorUmidade = new Chart(document.getElementById('sensorUmidade').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Umidade',
                    borderColor: 'blue',
                    backgroundColor: 'blue'
                },{
                    label: 'Limite Umidade',
                    borderColor: 'red',
                    backgroundColor: 'red'
                },{
                    label: 'Abaixo Umidade',
                    borderColor: 'green',
                    backgroundColor: 'green'
                }]
            },
            options: {
                scales: {
                    x: {
                        beginAtZero: true
                    },
                    y: {
                        title: {
                            display: true,
                            text: '(%)'
                        },
                        beginAtZero: true,
                    }
                }
            }
        });

        var paginacao = {};
        var tempo = {};

        function obterDadosUmidade(grafico, endpoint) {
            fetch('http://localhost:3300/sensores/' + endpoint)
                .then(response => response.json())
                .then(valores => {
                    if (paginacao[endpoint] == null) {
                        paginacao[endpoint] = 0;
                    }
                    if (tempo[endpoint] == null) {
                        tempo[endpoint] = 0;
                    }

                    var ultimaPaginacao = paginacao[endpoint];
                    paginacao[endpoint] = valores.length;
                    valores = valores.slice(ultimaPaginacao);

                    valores.forEach((valor) => {
                        if (grafico.data.labels.length == 10 && grafico.data.datasets[0].data.length == 10) {
                            grafico.data.labels.shift();
                            grafico.data.datasets[0].data.shift();
                        }

                        grafico.data.labels.push(tempo[endpoint]++);
                        grafico.data.datasets[0].data.push(parseFloat(valor - 15));
                        grafico.data.datasets[1].data.push(65);
                        grafico.data.datasets[2].data.push(40);
                        grafico.update();
                    });
                })
                .catch(error => console.error('Erro ao obter dados:', error));
        }

        function obterDadosTemperatura(grafico, endpoint) {
            fetch('http://localhost:3300/sensores/' + endpoint)
                .then(response => response.json())
                .then(valores => {
                    if (paginacao[endpoint] == null) {
                        paginacao[endpoint] = 0;
                    }
                    if (tempo[endpoint] == null) {
                        tempo[endpoint] = 0;
                    }

                    var ultimaPaginacao = paginacao[endpoint];
                    paginacao[endpoint] = valores.length;
                    valores = valores.slice(ultimaPaginacao);

                    valores.forEach((valor) => {
                        if (grafico.data.labels.length == 10 && grafico.data.datasets[0].data.length == 10) {
                            grafico.data.labels.shift();
                            grafico.data.datasets[0].data.shift();
                        }

                        grafico.data.labels.push(tempo[endpoint]++);
                        grafico.data.datasets[0].data.push(parseFloat(valor - 5));
                        grafico.data.datasets[1].data.push(27);
                        grafico.data.datasets[2].data.push(18);
                        grafico.update();
                    });
                })
                .catch(error => console.error('Erro ao obter dados:', error));
        }

        setInterval(() => {
            obterDadosTemperatura(sensorTemperatura, 'analogico');
            obterDadosUmidade(sensorUmidade, 'digital');
        }, 1000);

    </script>
</body>

</html>
