<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>EasyServer</title>

    <link rel="stylesheet" href="dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="topo">

        <h1>EasyServer</h1>

        <div>
            Sensor:

            <select id="sensor">

                <option value="1"> Sensor 01 - Rack 01 </option>
                <option value="2"> Sensor 02 - Rack 02 </option>

            </select>
        </div>

    </div>


    <div class="container">

        <!-- esquerda -->
        <div class="esquerda">

            <div class="kpis">

                <div class="card">
                    <h3>Temperatura Atual</h3>
                    <p id="tempAtual">26°C</p>
                </div>

                <div class="card">
                    <h3>Umidade Atual</h3>
                    <p id="umiAtual">56%</p>
                </div>

            </div>


            <div class="linha">

                <div class="graficoMenor">
                    <canvas id="graficoTemp"></canvas>
                </div>

                <div class="graficoMenor">
                    <canvas id="graficoUmidade"></canvas>
                </div>

            </div>


            <div class="graficoGrande">
                <canvas id="graficoPrincipal"></canvas>
            </div>

        </div>



        <!-- direita -->
        <div class="direita">

            <div class="box-alerta">
                <h2>Alertas</h2>

                <p id="alertas"> 2 ativos</p>
            </div>



            <div class="box-tab-status">

                <h2>Status dos Sensores</h2>

                <div class="tabela">

                    <div class="linha-topo">
                        <div>Sensor</div>
                        <div>Local</div>
                        <div>Temp</div>
                        <div>Umid</div>
                        <div>Status</div>
                    </div>

                    <div class="linha-status">

                        <div>Sensor 01</div>
                        <div>Rack 01</div>
                        <div>26.3°C</div>
                        <div>56.1%</div>

                        <div>
                            <span class="atencao" id="st1">
                                Atenção
                            </span>
                        </div>

                    </div>

                    <div class="linha-status">

                        <div>Sensor 02</div>
                        <div>Rack 02</div>
                        <div>28.1°C</div>
                        <div>67.2%</div>

                        <div>
                            <span class="critico" id="st2">
                                Crítico
                            </span>
                        </div>

                    </div>

                    <div class="linha-status">

                        <div>Sensor 03</div>
                        <div>Rack 03</div>
                        <div>22°C</div>
                        <div>50.3%</div>

                        <div>
                            <span class="normal" id="st3">
                                Normal
                            </span>
                        </div>

                    </div>

                </div>
            </div>

        </div>

    </div>


    <script>
        var tempoSeg = ["10", "11", "12", "13", "14", "15", "16"]; // grafico de linhas
        var tempoHoras = ["06h", "07h", "08h", "09h", "10h", "11h", "12h"]; // grafico de barras



        /* sensor 1 */
        var sensor1 = {
            temp: [25, 24, 26, 23, 25, 22, 23],
            umi: [38, 42, 40, 49, 53, 59, 54],

            tempAtual: "26°C",
            umiAtual: "56%",
            alerta: "2 ativos",

            status: ["Atenção", "Crítico", "Normal"]
        };


        /* sensor 2 */
        var sensor2 = {
            temp: [22, 23, 21, 24, 23, 21, 22],
            umi: [42, 44, 41, 45, 46, 50, 47],

            tempAtual: "28°C",
            umiAtual: "67%",
            alerta: "2 ativo",

            status: ["Atenção", "Crítico", "Normal"]
        };



        /* gráfico de Tem. e Umi. */

        var principal =
            new Chart(
                document.getElementById("graficoPrincipal"),
                {

                    data: {
                        labels: tempoHoras,

                        datasets: [

                            {
                                type: "bar",
                                label: "Temperatura",
                                data: sensor1.temp,
                                backgroundColor: "red"
                            },

                            {
                                type: "bar",
                                label: "Umidade",
                                data: sensor1.umi,
                                backgroundColor: "blue"
                            },

                            {
                                type: "line",
                                label: "Limite Temp",
                                data: [27, 27, 27, 27, 27, 27, 27],
                                borderColor: "red"
                            },

                            {
                                type: "line",
                                label: "Limite Umidade",
                                data: [55, 55, 55, 55, 55, 55, 55],
                                borderColor: "blue"
                            }

                        ]

                    }

                }
            );




        /* gráfico temperatura */

        var gTemp =
            new Chart(
                document.getElementById("graficoTemp"),
                {
                    type: "line",

                    data: {
                        labels: tempoSeg,

                        datasets: [
                            {
                                label: "Temperatura",
                                data: sensor1.temp,
                                borderColor: "red"
                            }
                        ]

                    }

                }
            );




        /* gráfico umidade */

        var gUmi =
            new Chart(
                document.getElementById("graficoUmidade"),
                {
                    type: "line",

                    data: {
                        labels: tempoSeg,

                        datasets: [
                            {
                                label: "Umidade",
                                data: sensor1.umi,
                                borderColor: "blue"
                            }
                        ]

                    }

                }
            );





        /* trocar sensor */

        document
            .getElementById("sensor")
            .addEventListener("change", trocar);


        function trocar() {

            var dados;

            if (
                document.getElementById("sensor").value == "1"
            ) {
                dados = sensor1;
            }

            else {
                dados = sensor2;
            }


            /* cards */
            document.getElementById("tempAtual").innerHTML = dados.tempAtual;

            document.getElementById("umiAtual").innerHTML = dados.umiAtual;

            document.getElementById("alertas").innerHTML = dados.alerta;


            /* status */
            document.getElementById("st1").innerHTML = dados.status[0];

            document.getElementById("st2").innerHTML = dados.status[1];

            document.getElementById("st3").innerHTML = dados.status[2];



            principal.data.datasets[0].data = dados.temp;
            principal.data.datasets[1].data = dados.umi;

            gTemp.data.datasets[0].data = dados.temp;

            gUmi.data.datasets[0].data = dados.umi;


            principal.update();
            gTemp.update();
            gUmi.update();

        }


    </script>

</body>

</html>
