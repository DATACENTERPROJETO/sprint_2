<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="style.css">
</head>
<header class="header">
    <section>
        <a href="index.html" class="logo">
            <img src="logoEasyServerPNG.png" alt="logo">
        </a>
        <nav class="navBar">
            <a href="index.html">Home</a>
            <a href="index.html#sobre">Sobre</a>
             <a href="login.html">Login </a>
            <a href="cadastro.html">Cadastro</a>

        </nav>
    </section>
</header>

<body>

    <div id="div_form">
        <span class="titu">LOGIN</span>

        <div class="linha">
            <span class="titulo_campo">Email</span>
            <div class="campo">
                <input id="ipt_email" placeholder="Email">
                <span id="msg_email"></span>
            </div>
        </div>

        <div class="linha">
            <span class="titulo_campo">Senha</span>
            <div class="campo">
                <input type="password" id="ipt_senha" placeholder="Senha">
                <span id="msg_senha"></span>
            </div>
        </div>

        <button onclick="Login()">Login</button>

        <p>
            Ainda não possui uma conta?
            <a href="cadastro.html" id="btn_cad">Cadastrar-se</a>
        </p>

        <div id="msg"></div>

    </div>

</body>

</html>

<script>
    let listaLogin = ['adm@gmail.com'];
    let listaSenha = ['adm@123'];
    let tentativa = 4;

    function Login() {

        let email = ipt_email.value;
        let senha = ipt_senha.value;
        let contador = 0;
        let erro = false;

        msg_email.innerHTML = "";
        msg_senha.innerHTML = "";
        msg.innerHTML = "";

        if (!email.includes('@')) {
            msg_email.innerHTML = "✖ Email inválido";
            erro = true;
        }

        if (senha.length < 6) {
            msg_senha.innerHTML = "✖ Senha inválida";
            erro = true;
        }

        if (!erro) {

            if (listaSenha[0] != senha) {
                if (tentativa > 1) {
                    while (contador < 1) {
                        tentativa--;
                        contador++
                        alert(`Senha Incorreta. Restam ${tentativa} chances!`)
                    }
                } else {
                    alert('Você errou a senha 3 vezes, tente nocamente mais tarde!')
                }
            } else {
                alert("Login realizado com sucesso!");
                window.location.href = "dashboard.html";


            }
        }
    }


</script>
